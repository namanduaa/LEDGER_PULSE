{% extends "base.html" %}
{% block title %}Edit transaction{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="crumbs">Transactions / <b>Edit</b></div>
    <h1>Edit {{ txn.payee }}</h1>
  </div>
</div>
<div class="card" style="max-width:560px">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "ledger/_transaction_fields.html" %}
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save changes</button>
      <a class="btn" href="{% url 'ledger:transactions' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
